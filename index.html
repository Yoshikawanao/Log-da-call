<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diário de Calls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN / CADASTRO -->
  <main id="tela-auth" class="tela" hidden>
    <section class="auth-card">
      <h1>Diário de Calls</h1>
      <p class="sub">O bloco de notas da call, agora com histórico e estatísticas.</p>

      <div class="abas" role="tablist">
        <button id="aba-entrar" class="aba ativa" type="button">Entrar</button>
        <button id="aba-criar" class="aba" type="button">Criar conta</button>
      </div>

      <div id="form-auth" class="form">
        <label id="campo-nome" hidden>Nome (como seus amigos te chamam)
          <input id="auth-nome" type="text" maxlength="30" autocomplete="nickname">
        </label>
        <label>E-mail
          <input id="auth-email" type="email" autocomplete="email">
        </label>
        <label>Senha
          <input id="auth-senha" type="password" autocomplete="current-password">
        </label>
        <p id="auth-erro" class="erro" role="alert"></p>
        <button id="btn-auth" class="btn-principal" type="button">Entrar</button>
        <button id="btn-esqueci" class="btn-link" type="button">Esqueci minha senha</button>
      </div>
    </section>
  </main>

  <!-- APP (depois do login) -->
  <div id="tela-app" class="tela" hidden>
    <header class="topo">
      <strong class="marca">Diário de Calls</strong>
      <div class="topo-direita">
        <span id="nome-usuario"></span>
        <button id="btn-sair" class="btn-sec" type="button">Sair</button>
      </div>
    </header>

    <div class="layout">
      <aside class="lateral">
        <h2>Seus grupos</h2>
        <ul id="lista-grupos" class="lista-grupos"></ul>
        <p id="sem-grupos" class="vazio" hidden>Você ainda não está em nenhum grupo. Crie o primeiro abaixo.</p>

        <div class="novo-grupo">
          <input id="novo-grupo-nome" type="text" maxlength="40" placeholder="Nome do novo grupo">
          <button id="btn-criar-grupo" class="btn-principal" type="button">Criar grupo</button>
        </div>
      </aside>

      <main class="conteudo" id="conteudo">
        <p class="vazio">Escolha um grupo para ver os membros.</p>
      </main>
    </div>
  </div>

  <p id="aviso" class="aviso" role="status" hidden></p>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
